<div
  class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm transition-all duration-300 hover:-translate-y-1 hover:shadow-xl"
>
  <!-- Header -->
  <div class="mb-5 flex items-start justify-between">
    <div>
      <a
        [routerLink]="['/courses', course().id]"
        class="text-xl font-bold text-slate-800 transition hover:text-indigo-600"
      >
        {{ course().title }}
      </a>

      <p class="mt-1 text-sm font-medium text-slate-500">
        {{ course().code }}
      </p>
    </div>

    <span class="text-3xl">📚</span>
  </div>

  <!-- Enrollment -->
  <div class="mb-4">
    <div class="mb-2 flex justify-between text-sm text-slate-500">
      <span>Enrollment</span>
      <span>{{ course().enrollmentCount }} / {{ course().Capacity }}</span>
    </div>

    <!-- Progress Bar -->
    <div class="h-2 w-full rounded-full bg-slate-200 overflow-hidden">
      <div
        class="h-full rounded-full bg-indigo-600"
        [style.width.%]="(course().enrollmentCount / course().Capacity) * 100">
      </div>
    </div>
  </div>

  <!-- Status -->
  <div class="mb-6">
    @if (course().enrollmentCount >= course().Capacity) {

      <span
        class="rounded-full bg-red-100 px-3 py-1 text-sm font-semibold text-red-600">
        🔴 Full
      </span>

    } @else {

      <span
        class="rounded-full bg-green-100 px-3 py-1 text-sm font-semibold text-green-600">
        🟢 Open
      </span>

    }
  </div>

  <!-- Button -->
  <button
    (click)="enrollClicked.emit(course())"
    [disabled]="course().enrollmentCount >= course().Capacity"
    class="w-full rounded-xl bg-indigo-600 py-3 font-semibold text-white transition hover:bg-indigo-700 disabled:cursor-not-allowed disabled:bg-slate-300 disabled:text-slate-500"
  >
    @if (course().enrollmentCount >= course().Capacity) {
      Course Full
    } @else {
      Enroll Now
    }
  </button>
</div>
