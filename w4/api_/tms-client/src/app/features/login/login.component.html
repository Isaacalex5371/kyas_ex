<div class="flex min-h-screen items-center justify-center bg-slate-100 p-6">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl border border-slate-200">
    <h2 class="text-3xl font-bold text-slate-800 text-center mb-2">Welcome Back</h2>
    <p class="text-sm text-slate-500 text-center mb-6">Sign in to your TMS account</p>

    @if (errorMessage()) {
      <div class="mb-4 rounded-xl bg-red-50 p-4 text-sm text-red-600 border border-red-200">
        {{ errorMessage() }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
        <input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="user@tms.com"
          class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="••••••••"
          class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm focus:border-indigo-500 focus:outline-none focus:ring-1 focus:ring-indigo-500"
        />
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full rounded-xl bg-indigo-600 px-4 py-3 text-sm font-semibold text-white transition hover:bg-indigo-700 disabled:opacity-50"
      >
        {{ isLoading() ? 'Signing in...' : 'Sign In' }}
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-slate-500">
      Don't have an account?
      <a routerLink="/register" class="font-medium text-indigo-600 hover:underline">Register</a>
    </p>
  </div>
</div>
