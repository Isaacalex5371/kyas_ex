<div class="min-h-screen bg-slate-50 px-6 py-8">

  <div class="mx-auto max-w-5xl">

    <!-- Top Navigation -->
    <div class="mb-8 flex items-center justify-between">

      <a
        routerLink="/dashboard"
        class="group inline-flex items-center gap-2 text-sm font-semibold text-slate-600 transition hover:text-indigo-600"
      >
        <span
          class="flex h-9 w-9 items-center justify-center rounded-lg border border-slate-200 bg-white shadow-sm transition group-hover:border-indigo-200 group-hover:bg-indigo-50"
        >
          ←
        </span>

        Back to Dashboard
      </a>

    </div>

    <!-- Course Header -->
    <div class="relative overflow-hidden rounded-3xl bg-slate-900 px-8 py-10 shadow-xl">

      <!-- Decorative shapes -->
      <div class="absolute -right-20 -top-20 h-64 w-64 rounded-full bg-indigo-500/20 blur-3xl"></div>
      <div class="absolute -bottom-20 left-1/3 h-52 w-52 rounded-full bg-violet-500/20 blur-3xl"></div>

      <div class="relative">

        <div class="mb-5 flex items-center gap-3">

          <span
            class="rounded-full bg-indigo-500/20 px-3 py-1 text-xs font-bold uppercase tracking-wider text-indigo-300"
          >
            Course
          </span>

          <span class="text-sm text-slate-400">
            #{{ id() }}
          </span>

        </div>

        <h1 class="text-4xl font-bold tracking-tight text-white">
          Course Details
        </h1>

        <p class="mt-3 max-w-xl text-slate-400">
          View the information and details associated with this course.
        </p>

      </div>

    </div>

    <!-- Content -->
    <div class="mt-6 grid gap-6 md:grid-cols-3">

      <!-- Course ID -->
      <div
        class="md:col-span-2 rounded-2xl border border-slate-200 bg-white p-7 shadow-sm"
      >

        <div class="flex items-start justify-between">

          <div>

            <p class="text-sm font-semibold uppercase tracking-wider text-slate-400">
              Course ID
            </p>

            <p class="mt-3 text-4xl font-bold text-slate-900">
              {{ id() }}
            </p>

          </div>

          <!-- Icon -->
          <div
            class="flex h-12 w-12 items-center justify-center rounded-xl bg-indigo-50 text-indigo-600"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.8"
              stroke="currentColor"
              class="h-6 w-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 6.75 19.5 10.5 12 14.25 4.5 10.5 12 6.75Z"
              />

              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6.75 12.75v3.75c0 1.243 2.35 2.25 5.25 2.25s5.25-1.007 5.25-2.25v-3.75"
              />
            </svg>
          </div>

        </div>

      </div>

      <!-- Status -->
      <div
        class="rounded-2xl border border-slate-200 bg-white p-7 shadow-sm"
      >

        <p class="text-sm font-semibold uppercase tracking-wider text-slate-400">
          Status
        </p>

        <div class="mt-4 flex items-center gap-3">

          <span
            class="h-3 w-3 rounded-full bg-emerald-500"
          ></span>

          <span class="font-semibold text-slate-800">
            Active
          </span>

        </div>

        <p class="mt-3 text-sm text-slate-500">
          This course is currently available.
        </p>

      </div>

    </div>

    <!-- Bottom Information -->
    <div
      class="mt-6 rounded-2xl border border-slate-200 bg-white p-7 shadow-sm"
    >

      <div class="flex items-center gap-4">

        <div
          class="flex h-11 w-11 items-center justify-center rounded-xl bg-violet-50 text-violet-600"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.8"
            stroke="currentColor"
            class="h-6 w-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 6v6l4 2"
            />

            <circle
              cx="12"
              cy="12"
              r="9"
            />
          </svg>
        </div>

        <div>

          <h2 class="font-semibold text-slate-900">
            Course Information
          </h2>

          <p class="mt-1 text-sm text-slate-500">
            More course information can be displayed here later.
          </p>

        </div>

      </div>

    </div>

  </div>

</div>
